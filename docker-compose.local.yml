name: ${PROJECT_NAME}-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${PROJECT_NAME}-postgres-local
    environment:
      POSTGRES_USER: wm_user
      POSTGRES_PASSWORD: REDACTED
      POSTGRES_DB: work_manager
    ports:
      - "7020:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
    name: ${PROJECT_NAME}-local_pgdata
