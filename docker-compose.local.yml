name: wm-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: wm-postgres-local
    environment:
      POSTGRES_USER: wm_user
      POSTGRES_PASSWORD: REDACTED
      POSTGRES_DB: work_manager
    ports:
      - "7020:5432"
    volumes:
      - wm_pgdata_local:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  wm_pgdata_local:
